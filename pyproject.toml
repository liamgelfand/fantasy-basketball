[project]
name = "fbb"
version = "1.1.0"
description = "ESPN fantasy basketball analyst: matchup projections, pickups, trades, and a Claude agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 145
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E731",   # small lambdas as local key functions read fine here
  "SIM108", # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"fbb/agent.py" = ["E501"]  # tool descriptions are long prose strings
